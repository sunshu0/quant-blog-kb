# 术语表（design.md 4.5）。英文 → 中文，同步到 DeepL glossary。
# 改动后递增 version（只用于 DeepL 术语表的名字 qbkb-v<version>-<指纹>，内容变了才新建）。
# 翻译记忆按段落记录"这段用到的术语"的指纹：改一个词条，只有含这个词的段落会重翻。
# 改之前可以用 translate.glossary_upgrade_cost() 看要重翻多少字符。
# 句首大写（Drawdown）、标题大写（Trend Following）的变体会自动补上，不用手写。

version: 1
terms:
  drawdown: 回撤
  trend following: 趋势跟踪
  momentum: 动量
  carry: 套息
  Sharpe ratio: 夏普比率
  factor: 因子
  alpha: alpha
  beta: beta
  volatility: 波动率
  backtest: 回测
  mean reversion: 均值回归
  risk parity: 风险平价
  CTA: CTA
