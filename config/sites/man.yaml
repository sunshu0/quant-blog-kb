# Man Group insights。字段说明见 docs/design.md 3.1、4.1、4.3。
# discover / extract 两节由 Phase 1 的 A、B 线补全。

compliance:
  robots_txt: "只禁止 /core/ 和 /profiles/，/insights/ 放行"
  terms_url: https://www.man.com/terms-and-conditions
  terms_summary: >-
    第 6 节：未经书面许可，不得用自动化手段抓取、存储、挖掘内容用于公开或商业目的；
    禁止再分发、去掉版权声明、系统化下载建库。
  permission: "用户已获得许可（2026-11-11），凭证由用户保管；许可不含公开再分发"
  checked_at: 2026-11-11
  decision: allowed

base_url: https://www.man.com
# 输出 frontmatter 的 firm 字段和来源说明里用的机构名
firm: Man Group
# 两次请求的最小间隔（秒）。robots.txt 没写 Crawl-delay，但抽样抓取时用 10.5 秒间隔
# 全程没遇 403/429（见 D:\dev\qbkb_smoke\man\man-survey.md 第 1 节），沿用同样的礼貌间隔。
crawl_delay: 10.5

discover:
  sitemap: https://www.man.com/sitemap.xml
  include_prefixes:
    - /insights/
  exclude_prefixes:
    - /it/
    - /es/
    - /insights/subscription

extract:
  # 正文少于这么多字符就标记"正文太短"（视频页、播客页通常会被标出来）
  min_chars: 1000
  # 出现在正文里就标记出来给人看（不自动删除）。按整词、不分大小写匹配；
  # 不用单独的 "cookie"：正文里谈 cookies 的句子会误报
  noise_keywords:
    - You are leaving
    - You are now leaving
    - accept cookies
    - cookie policy
    - cookie settings
    - Subscribe to Man Insights
    - Thank you for subscribing
    - Please select your country
  # og:title 带站名后缀
  title_strip: '\s*\|\s*Man Group\s*$'
  # 全站噪音（在默认的 script/iframe/form/button/nav 等之外）
  remove:
    - .modal
    - "[id^=qumu-video]"
    - .digital-media
    - .d-md-none # 响应式布局里给手机看的重复内容
    # 摘句（pull quote）：把正文里的一句话放大重复一遍，译文里读起来是重复的（2026-11-12 验收）
    - .digital-quote
    - .digital-mi-quote
  # 纯文字匹配就删掉的段落（和图注同一个 class，选择器区分不了）
  drop_text:
    - '^Problems loading this infographic\?'
  # 版权声明和重要信息：每篇都一样，翻译记忆只翻一次；原样附在正文后（design.md 3.3）
  # 只做安全清理，不套用上面的 remove / drop_text；同一选择器的全部匹配都附上（重复内容只留一份）
  keep:
    - "#pdf-article-header"
    - selector: "#insights-important-information-section-title"
      remove:
        - .d-md-none # 标题里给手机看的重复文字
    - "#insights-important-information-section .accordion-body"
  # 模板没给出作者时用（A Moment in Macro 博客页的作者卡片；不写的话 trafilatura 会把
  # "About the author" 小标题和职位一起抽成作者）
  author_fallback:
    - "#insights-blog-author-grid .team-card h4"
  templates:
    # /insights/ 下的文章、视频、播客共用一个 Drupal 模板
    - name: insight
      url_prefix: /insights/
      require: "#article-body-text"
      title: "#article-title-text h1"
      published: "#article-date-text p"
      author: "#article-authors a span.fw-600"
      tags:
        selector: "#article-tagline-text p"
        pattern: '^\s*([^|]+?)\s*(?:\||$)' # "ARTICLE | 8 MIN" -> ARTICLE
      body:
        - "#article-intro-blurb-text .paragraph-body"
        - "#article-body-text .digital-article"

# 栏目（design.md 4.8）。采集阶段只按这里的 collect 决定翻译哪些文章，不做任何价值判断。
# 调研依据：D:\dev\qbkb_smoke\man\man-survey.md（129 篇抽样，2026-11-13）。
#
# 用户 2026-11-13 看完抽样表后决定：只整栏采集「独立文章」（article）。它「要」占比 50%，
# 没过 70% 门槛（量化方法论内容最集中的栏目，但混入约一半宏观/webinar，用户仍决定采集）。
# 其余栏目保持 false、待调研，不采集。勾选后的下一次运行自动补上（不重抓）。
# 调研用 `qbkb sections --site man`；勾选后把 status 改成"已调研"，survey 填上调研记录。
sections:
  # Man 的文章网址是平铺的 /insights/<slug>，看不出栏目：栏目 = tagline 的"类型 + 系列名"。
  # tagline 格式"类型 | 时长 | 系列名"，时长和系列名都可能没有：
  #   "ARTICLE | 4 MIN | VIEWS FROM THE FLOOR" → "ARTICLE | VIEWS FROM THE FLOOR"
  #   "VIDEO | 7 MIN" → "VIDEO"
  page_key:
    selector: "#article-tagline-text p"
    pattern: '^\s*(?P<type>[^|]+?)\s*(?:\|\s*(?P<length>\d+\s*MINS?)\s*)?(?:\|\s*(?P<series>[^|]+?)\s*)?$'
    parts: [type, series]
  # dataLayer 的 contentType 和 tagline 的类型有不一致的（webinar-sfdr-explained 等），
  # 不一致时记一条质量提示，以 tagline 为准
  cross_check:
    pattern: '"contentType"\s*:\s*"([^"]+)"'
    part: type
    label: dataLayer contentType
    # 播客页的 contentType 多数写的是 Article（样本 5 篇里 4 篇），不算不一致
    equivalent: {PODCAST: [Article]}
  # 每个栏目：id（不要改，状态库里记的是它）、name、url_prefix 或 key（二选一）、collect、
  # status、survey（调研记录）、estimate（没抓页面时按网址最后一段估计篇数，只用于调研）。
  # 括号里的篇数是调研时按 sitemap 网址估计的，不是实际篇数。
  list:
    - id: a-moment-in-macro
      name: A Moment in Macro（宏观博客）
      url_prefix: /insights/a-moment-in-macro
      collect: false
      status: 待调研 # 约 4 篇；v1 里按"宏观周评"整栏排除
      survey: {sampled: null, wanted: null, ratio: null, date: null, by: null}
    - id: article
      name: 独立文章
      key: ARTICLE
      collect: true
      status: 已选择 # 约 509 篇，量化方法论类文章最集中的地方；抽样 50% 未过 70% 门槛，用户仍决定采集
      survey: {sampled: 20, wanted: 10, ratio: 0.50, date: 2026-11-13, by: "孙硕（AI 初标，用户决定）"}
    - id: views-from-the-floor
      name: Views From the Floor（每周市场评论）
      key: ARTICLE | VIEWS FROM THE FLOOR
      collect: false
      status: 待调研 # 约 289 篇
      survey: {sampled: null, wanted: null, ratio: null, date: null, by: null}
      estimate: ['^views-from-the-floor']
    - id: the-road-ahead
      name: The Road Ahead
      key: ARTICLE | THE ROAD AHEAD
      collect: false
      status: 待调研 # 约 53 篇
      survey: {sampled: null, wanted: null, ratio: null, date: null, by: null}
      estimate: ['road-ahead']
    - id: the-early-view
      name: The Early View
      key: ARTICLE | THE EARLY VIEW
      collect: false
      status: 待调研 # 约 57 篇
      survey: {sampled: null, wanted: null, ratio: null, date: null, by: null}
      estimate: ['early-view']
    - id: a-sustainable-future
      name: A Sustainable Future（播客）
      key: PODCAST | A SUSTAINABLE FUTURE
      collect: false
      status: 待调研 # 约 73 篇
      survey: {sampled: null, wanted: null, ratio: null, date: null, by: null}
      estimate: ['^ri-podcast']
    - id: podcast
      name: 其他播客
      key: PODCAST
      collect: false
      status: 待调研 # 约 9 篇（如 Long Story Short；它们若带系列名，会作为新栏目提醒）
      survey: {sampled: null, wanted: null, ratio: null, date: null, by: null}
      estimate: ['podcast']
    - id: video
      name: 视频（含 AHL Explains）
      key: VIDEO
      collect: false
      status: 待调研 # 约 16 篇（13 个 AHL Explains + 3 个 webinar）
      survey: {sampled: null, wanted: null, ratio: null, date: null, by: null}
      estimate: ['^ahl-explains', 'video', 'webinar']
