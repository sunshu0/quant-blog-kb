# Man Group insights。字段说明见 docs/design.md 3.1、4.1、4.3。
# discover / extract 两节由 Phase 1 的 A、B 线补全。

compliance:
  robots_txt: "只禁止 /core/ 和 /profiles/，/insights/ 放行"
  terms_url: https://www.man.com/terms-and-conditions
  terms_summary: >-
    第 6 节：未经书面许可，不得用自动化手段抓取、存储、挖掘内容用于公开或商业目的；
    禁止再分发、去掉版权声明、系统化下载建库。
  permission: "用户已获得许可（2026-11-11），凭证由用户保管；许可不含公开再分发"
  checked_at: 2026-11-11
  decision: allowed

base_url: https://www.man.com

discover:
  sitemap: https://www.man.com/sitemap.xml
  include_prefixes:
    - /insights/
  exclude_prefixes:
    - /it/
    - /es/
    - /insights/subscription

extract:
  # 正文少于这么多字符就标记"正文太短"（视频页、播客页通常会被标出来）
  min_chars: 1000
  # 出现在正文里就标记出来给人看（不自动删除）
  noise_keywords:
    - You are leaving
    - You are now leaving
    - cookie
    - Subscribe to Man Insights
    - Thank you for subscribing
    - Please select your country
  # og:title 带站名后缀
  title_strip: '\s*\|\s*Man Group\s*$'
  # 全站噪音（在默认的 script/iframe/form/button/nav 等之外）
  remove:
    - .modal
    - "[id^=qumu-video]"
    - .digital-media
    - .d-md-none # 响应式布局里给手机看的重复内容
  # 纯文字匹配就删掉的段落（和图注同一个 class，选择器区分不了）
  drop_text:
    - '^Problems loading this infographic\?'
  # 版权声明和重要信息：每篇都一样，翻译记忆只翻一次；原样附在正文后（design.md 3.3）
  keep:
    - "#pdf-article-header"
    - "#insights-important-information-section-title"
    - "#insights-important-information-section .accordion-body"
  templates:
    # /insights/ 下的文章、视频、播客共用一个 Drupal 模板
    - name: insight
      url_prefix: /insights/
      require: "#article-body-text"
      title: "#article-title-text h1"
      published: "#article-date-text p"
      author: "#article-authors a span.fw-600"
      tags:
        selector: "#article-tagline-text p"
        pattern: '^\s*([^|]+?)\s*(?:\||$)' # "ARTICLE | 8 MIN" -> ARTICLE
      body:
        - "#article-intro-blurb-text .paragraph-body"
        - "#article-body-text .digital-article"
